# Static analysis configuration.
#
# The architecture rules the analyzer cannot express — the layer dependency
# rule and domain purity — are enforced by `dart run tool/check_architecture.dart`,
# which CI must run alongside `flutter analyze`.

include: package:flutter_lints/flutter.yaml

analyzer:
  errors:
    # Pre-existing across the codebase; not worth blocking a build over.
    deprecated_member_use: ignore
    depend_on_referenced_packages: ignore

    # `print` reaches logcat/os_log in release builds. The payment path was
    # logging customer name, phone, email and payment identifiers this way.
    # Debug output must be wrapped in `if (kDebugMode)`, which this lint accepts.
    avoid_print: error

    # Using a BuildContext after an await when the widget may be gone. These
    # are crashes, not style. 21 known occurrences remain — see the migration
    # plan — so this stays a warning until they are cleared, then becomes error.
    use_build_context_synchronously: warning

  exclude:
    - "**/*.g.dart"
    - "**/*.freezed.dart"

linter:
  rules:
    # --- correctness ---
    always_use_package_imports: false      # relative imports are the house style
    # avoid_dynamic_calls — worth adopting, but it reports 193 existing sites.
    # Turning it on now would bury the 21 real use_build_context_synchronously
    # crashes in noise. It is the rule that would have caught the `List<dynamic>`
    # parameter in subcategory_screen, where member access compiled against
    # anything and would have thrown at runtime. Enable once those are typed.
    # avoid_dynamic_calls: true
    avoid_slow_async_io: true
    cancel_subscriptions: true
    close_sinks: true
    unrelated_type_equality_checks: true
    test_types_in_equals: true
    throw_in_finally: true
    valid_regexps: true

    # --- immutability, per docs/ARCHITECTURE.md ---
    prefer_final_fields: true
    prefer_final_locals: false             # too noisy to adopt in one pass
    avoid_setters_without_getters: true
    prefer_const_constructors: false        # would flag most of the existing UI

    # --- clarity ---
    avoid_returning_null_for_void: true
    avoid_void_async: true
    prefer_typing_uninitialized_variables: true
    unnecessary_null_aware_assignments: true
    unnecessary_statements: true
    use_super_parameters: true
